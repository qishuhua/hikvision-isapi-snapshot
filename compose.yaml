services:
  snapshot:
    build: .
    image: hikvision-isapi-snapshot:0.1.0
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATA_PATH: /app/data/state.json
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      MAX_CONCURRENT_CAPTURES: ${MAX_CONCURRENT_CAPTURES:-4}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - snapshot-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  snapshot-data:
